[package]
name = "ruvel"
version = "0.5.0"
edition = "2024"
description = "The laravel alternative framework with rust performance"
homepage = "https://github.com/Stephan-MC/ruvel"
authors = ['Stephan Munde <mundestephane13@gmail.com>']
readme = "README.md"
license = "MIT OR Apache-2.0"


[dependencies]
arc-swap = "1.9.3"
async-trait = "0.1.92"
dashmap = "6.2.1"
httparse = "1.10.1"
matchit = "0.9.2"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "mysql",
] }

[lints.clippy]
async_fn_in_trait = "allow"
