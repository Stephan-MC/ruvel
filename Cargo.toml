[package]
name = "ruvel"
version = "0.8.0"
edition = "2024"
description = "The laravel alternative framework with rust performance"
homepage = "https://github.com/Stephan-MC/ruvel"
authors = ['Stephan Munde <mundestephane13@gmail.com>']
readme = "README.md"
license = "MIT OR Apache-2.0"


[dependencies]
arc-swap = "1.9.3"
httparse = "1.10.1"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "mysql",
] }
regex = "1"

[lints.clippy]
async_fn_in_trait = "allow"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "router"
harness = false

[[bench]]
name = "http"
harness = false
